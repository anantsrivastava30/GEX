    - 10
    - 11
    - 13
    - 27
    - 46
    - 50
    - 51
    - 53
    - 54
    - 97
    - 101
    - 180
    - 192
    - 291

# O'Neil market direction (see docs/ONEIL_CANSLIM_PLAN.md). Sector and
# market index ETFs tracked by the rally-attempt / follow-through-day state
# machine, EMA touch alerts, and the index-adapted CAN SLIM scorecard.
# Thresholds are surfaced in the UI help, never hidden.
market_direction:
  benchmark: SPY
  history_days: 730
  ftd_gain_pct: 1.25
  ema_periods: [20, 50, 200]
  ema_touch_band_pct: 0.4
  rsi_period: 14
  correction_drawdown_pct: 8.0
  distribution_pressure_count: 4
  distribution_correction_count: 6
  # domain = which part of the market the index rules, shown as a tag in the UI.
  indices:
    - { symbol: SPY, label: "S&P 500", group: "Broad market", domain: "The whole US large-cap market" }
    - { symbol: QQQ, label: "Nasdaq-100", group: "Broad market", domain: "Mega-cap tech and growth" }
    - { symbol: DIA, label: "Dow Industrials", group: "Broad market", domain: "30 blue-chip leaders" }
    - { symbol: IWM, label: "Russell 2000", group: "Broad market", domain: "Small caps and risk appetite" }
    - { symbol: SMH, label: "Semiconductors", group: "Sector", domain: "Chipmakers and semi equipment" }
    - { symbol: XLK, label: "Technology", group: "Sector", domain: "Software, hardware, and IT" }
    - { symbol: XLF, label: "Financials", group: "Sector", domain: "Banks, brokers, and insurers" }
    - { symbol: XLE, label: "Energy", group: "Sector", domain: "Oil, gas, and energy majors" }
    - { symbol: XLV, label: "Health care", group: "Sector", domain: "Pharma, insurers, and med-tech" }
    - { symbol: XLI, label: "Industrials", group: "Sector", domain: "Defense, machinery, and transport" }
    - { symbol: XLY, label: "Consumer discretionary", group: "Sector", domain: "Retail, autos, and travel" }
    - { symbol: XLP, label: "Consumer staples", group: "Sector", domain: "Household staples and groceries" }
    - { symbol: XLU, label: "Utilities", group: "Sector", domain: "Electric, gas, and water utilities" }
    - { symbol: XLB, label: "Materials", group: "Sector", domain: "Chemicals, metals, and miners" }
    - { symbol: XBI, label: "Biotech", group: "Sector", domain: "Clinical and commercial biotech" }
    - { symbol: XLRE, label: "Real estate", group: "Sector", domain: "REITs and property" }

# Per-stock CAN SLIM scan (see docs/ONEIL_CANSLIM_PLAN.md). Candidates come
# from the holdings of every tracked market_direction ETF, so leaders are
# found across all market sections rather than only in saved watchlists.
# Index and leveraged ETFs are excluded as candidates (no earnings).
# Thresholds follow O'Neil's published numbers and are shown in the UI.
canslim:
  exclude: [SPY, QQQ, IWM, DIA, SMH, SOXL, XLK, XLF, XLE, XLV, XLI, XLY, XLP, XLU, XLB, XBI, XLRE]
  # Universe construction. Holdings are read from the provider once a day;
  # each ETF contributes at most max_constituents_per_etf names.
  include_watchlist_symbols: true
  max_constituents_per_etf: 12
  max_symbols: 160
  # Bars are fetched for the whole universe (cheap, cached), but company
  # fundamentals are fetched only for the strongest technical candidates.
  # The rest are reported as technical-only rather than guessed.
  fundamentals_top_n: 25
  fetch_workers: 6
  fundamentals_pause_seconds: 0.4
  quarterly_growth_met_pct: 25.0
  quarterly_growth_borderline_pct: 15.0
  annual_growth_met_pct: 25.0
  annual_growth_borderline_pct: 15.0
  roe_met_pct: 17.0
  breakout_volume_ratio: 1.4
  rs_met_percentile: 67.0
  stop_loss_pct: 8.0
  max_extension_pct: 5.0
  # Used only when live ETF holdings are unreachable. A hand-maintained
  # snapshot of large holdings per ETF - it drifts over time, so the UI
  # labels the universe source when this fallback is in use. Edit freely.
  fallback_constituents:
    SPY: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AVGO, JPM, LLY]
    QQQ: [AAPL, MSFT, NVDA, AMZN, META, GOOGL, TSLA, AVGO, COST, NFLX]
    DIA: [UNH, GS, MSFT, HD, CAT, CRM, V, AXP, MCD, AMGN]
    SMH: [NVDA, TSM, AVGO, AMD, QCOM, TXN, AMAT, LRCX, KLAC, MU, ADI, INTC]
    XLK: [AAPL, MSFT, NVDA, AVGO, CRM, AMD, ORCL, ACN, ADBE, CSCO]
    XLF: [JPM, V, MA, BAC, WFC, GS, MS, SPGI, BLK, AXP]
    XLE: [XOM, CVX, COP, EOG, SLB, MPC, PSX, VLO, OXY, WMB]
    XLV: [LLY, UNH, JNJ, MRK, ABBV, TMO, ABT, DHR, PFE, AMGN]
    XLI: [GE, CAT, RTX, UNP, HON, BA, DE, LMT, UPS, ETN]
    XLY: [AMZN, TSLA, HD, MCD, BKNG, LOW, TJX, NKE, SBUX, CMG]
    XLP: [PG, COST, WMT, KO, PEP, PM, MO, MDLZ, CL, TGT]
    XLU: [NEE, SO, DUK, CEG, SRE, AEP, D, EXC, XEL, ED]
    XLB: [LIN, SHW, APD, ECL, FCX, NEM, DOW, DD, PPG, NUE]
    XBI: [VRTX, REGN, MRNA, ALNY, INCY, EXAS, NBIX, SRPT, IONS, UTHR]
    XLRE: [PLD, AMT, EQIX, WELL, SPG, PSA, O, CCI, DLR, EXR]

# Daily own-data history collection (see docs/UW_PARITY_PLAN.md).
# Keep the universe small enough that one run stays inside Tradier's
# rate limit: each ticker costs 2 + num_expirations requests.
snapshots:
  dir: "data/snapshots"
  # Runtime-only append archive. Local backend captures write one Parquet file
  # per ticker and run; GitHub Actions continues committing only daily files.
  intraday_dir: "data/intraday_snapshots"
  num_expirations: 4
  strike_offset: 35
  # Configured tickers plus custom watchlist symbols share this capacity.
  max_symbols: 50
  # One capture uses a quote, expirations, and the configured chain expirations.
  # Pace the bounded universe so scheduler runs stay below the free-data limit.
  refresh_pause_seconds: 6.0
  tickers:
    - SPY
    - QQQ
    - IWM
    - DIA
    - AAPL
    - MSFT
    - NVDA
    - TSLA
    - AMZN
    - GOOGL
    - META
    - AMD
    - NFLX
    - INTC
    - MU
    - SNDK
    - PENG
    - SMH
    - SOXL
    - AVGO
    - MRVL
