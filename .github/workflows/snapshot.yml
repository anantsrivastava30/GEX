name: Daily market snapshot

# Captures option-chain snapshots (OI, volume, IV, greeks, GEX profile,
# gamma-gap score) for the configured watchlist and commits them under
# data/snapshots/, building our own history for IV rank, OI-change,
# historical GEX and the gamma-gap track record.
#
# Requires the TRADIER_TOKEN repository secret. Scheduled runs only fire
# on the default branch.

on:
  schedule:
    # 21:20 UTC weekdays = after the 4pm ET close year-round.
    - cron: "20 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Tradier credential
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: |
          if [ -z "$TRADIER_TOKEN" ]; then
            echo "::error::TRADIER_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 2
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture snapshots
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
        run: python -m quant_analysis.scripts.snapshot

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "data: market snapshot $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
